[project]
name = "telemetry-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi==0.115.12", "uvicorn==0.34.2", "clickhouse-connect==0.8.18", "httpx==0.28.1", "pydantic-settings==2.9.1"]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[build-system]
requires = ["setuptools==80.3.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
